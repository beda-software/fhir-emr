resourceType: ViewDefinition
id: obs-urea-nitrogen
url: ViewDefinition/obs-urea-nitrogen
name: obs_urea_nitrogen
title: "Urea nitrogen"
status: active
resource: Observation
meta:
  tag:
    - system: https://emr.beda.software/CodeSystem/view-chart
      code: numeric
description: "One row per 'Urea nitrogen' Observation for ViewChart dashboards. Codes: LOINC 6299-2 (Urea Nitrogen); LOINC 3094-0 (Urea nitrogen [Mass/volume] in Serum or Plasma)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '6299-2') or (system = 'http://loinc.org' and code = '3094-0')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Urea nitrogen'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
