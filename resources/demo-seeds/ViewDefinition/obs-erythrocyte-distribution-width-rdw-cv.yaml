description: "One row per 'Erythrocyte distribution width (RDW-CV)' Observation for ViewChart dashboards. Codes: LOINC 788-0 (Erythrocyte [DistWidth] in Blood by Automated count); LOINC 30385-9 (RBC Distribution Width)."
where:
