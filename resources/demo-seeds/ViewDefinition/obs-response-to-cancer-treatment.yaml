resourceType: ViewDefinition
id: obs-response-to-cancer-treatment
url: ViewDefinition/obs-response-to-cancer-treatment
name: obs_response_to_cancer_treatment
title: "Response to cancer treatment"
status: active
resource: Observation
description: "One row per 'Response to cancer treatment' Observation for ViewChart dashboards. Codes: LOINC 88040-1 (Response to cancer treatment)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '88040-1')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Response to cancer treatment'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
