resourceType: ViewDefinition
id: obs-hemoglobin-a1c
url: ViewDefinition/obs-hemoglobin-a1c
name: obs_hemoglobin_a1c
title: "Hemoglobin A1c"
status: active
resource: Observation
meta:
  tag:
    - system: https://emr.beda.software/CodeSystem/view-chart
      code: numeric
description: "One row per 'Hemoglobin A1c' Observation for ViewChart dashboards. Codes: LOINC 4548-4 (Hemoglobin A1c/Hemoglobin.total in Blood); SNOMED 259689004 (HbA1c - Diabetic control parameter)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '4548-4') or (system = 'http://snomed.info/sct' and code = '259689004')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Hemoglobin A1c'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
