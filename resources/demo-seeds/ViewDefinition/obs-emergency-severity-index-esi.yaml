resourceType: ViewDefinition
id: obs-emergency-severity-index-esi
url: ViewDefinition/obs-emergency-severity-index-esi
name: obs_emergency_severity_index_esi
title: "Emergency severity index [ESI]"
status: active
resource: Observation
description: "One row per 'Emergency severity index [ESI]' Observation for ViewChart dashboards. Codes: LOINC 75636-1 (Emergency severity index [ESI])."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '75636-1')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Emergency severity index [ESI]'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
