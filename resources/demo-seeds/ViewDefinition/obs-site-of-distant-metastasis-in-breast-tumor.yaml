resourceType: ViewDefinition
id: obs-site-of-distant-metastasis-in-breast-tumor
url: ViewDefinition/obs-site-of-distant-metastasis-in-breast-tumor
name: obs_site_of_distant_metastasis_in_breast_tumor
title: "Site of distant metastasis in Breast tumor"
status: active
resource: Observation
description: "One row per 'Site of distant metastasis in Breast tumor' Observation for ViewChart dashboards. Codes: LOINC 44667-4 (Site of distant metastasis in Breast tumor)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '44667-4')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Site of distant metastasis in Breast tumor'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
