resourceType: ViewDefinition
id: obs-calcium
url: ViewDefinition/obs-calcium
name: obs_calcium
title: "Calcium"
status: active
resource: Observation
meta:
  tag:
    - system: https://emr.beda.software/CodeSystem/view-chart
      code: numeric
description: "One row per 'Calcium' Observation for ViewChart dashboards. Codes: LOINC 49765-1 (Calcium [Mass/volume] in Blood); LOINC 17861-6 (Calcium [Mass/volume] in Serum or Plasma)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '49765-1') or (system = 'http://loinc.org' and code = '17861-6')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Calcium'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
