resourceType: ViewDefinition
id: obs-bacteria-identified-in-urine-by-culture
url: ViewDefinition/obs-bacteria-identified-in-urine-by-culture
name: obs_bacteria_identified_in_urine_by_culture
title: "Bacteria identified in Urine by Culture"
status: active
resource: Observation
description: "One row per 'Bacteria identified in Urine by Culture' Observation for ViewChart dashboards. Codes: LOINC 630-4 (Bacteria identified in Urine by Culture)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '630-4')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Bacteria identified in Urine by Culture'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
