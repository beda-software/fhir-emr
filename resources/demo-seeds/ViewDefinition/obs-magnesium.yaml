resourceType: ViewDefinition
id: obs-magnesium
url: ViewDefinition/obs-magnesium
name: obs_magnesium
title: "Magnesium"
status: active
resource: Observation
meta:
  tag:
    - system: https://emr.beda.software/CodeSystem/view-chart
      code: numeric
description: "One row per 'Magnesium' Observation for ViewChart dashboards. Codes: LOINC 19123-9 (Magnesium [Mass/volume] in Serum or Plasma); LOINC 21377-7 (Magnesium [Mass/volume] in Blood)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '19123-9') or (system = 'http://loinc.org' and code = '21377-7')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Magnesium'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
