resourceType: ViewDefinition
id: obs-physical-findings-of-prostate
url: ViewDefinition/obs-physical-findings-of-prostate
name: obs_physical_findings_of_prostate
title: "Physical findings of Prostate"
status: active
resource: Observation
description: "One row per 'Physical findings of Prostate' Observation for ViewChart dashboards. Codes: LOINC 32465-7 (Physical findings of Prostate)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '32465-7')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Physical findings of Prostate'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
