resourceType: ViewDefinition
id: obs-pain-intensity-enjoyment-of-life-general-activity-sc
url: ViewDefinition/obs-pain-intensity-enjoyment-of-life-general-activity-sc
name: obs_pain_intensity_enjoyment_of_life_general_activity_sc
title: "Pain intensity, Enjoyment of life, General activity scale [PEG]"
status: active
resource: Observation
meta:
  tag:
    - system: https://emr.beda.software/CodeSystem/view-chart
      code: numeric
description: "One row per 'Pain intensity, Enjoyment of life, General activity scale [PEG]' Observation for ViewChart dashboards. Codes: LOINC 91148-7 (Pain intensity, Enjoyment of life, General activity scale [PEG]). value_quantity is the pain severity component, other PEG components are separate columns."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '91148-7')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Pain intensity, Enjoyment of life, General activity scale [PEG]'"
        type: string
      - name: unit
        path: "'{score}'"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: reference_range
        path: "referenceRange"
        collection: true
      - name: value_quantity
        path: "component.where(code.coding.where((system = 'http://loinc.org' and code = '75893-8')).exists()).value.ofType(Quantity).value.first()"
        type: decimal
      - name: enjoyment_of_life
        path: "component.where(code.coding.where((system = 'http://loinc.org' and code = '91145-3')).exists()).value.ofType(Quantity).value.first()"
        type: decimal
      - name: general_activity
        path: "component.where(code.coding.where((system = 'http://loinc.org' and code = '91146-1')).exists()).value.ofType(Quantity).value.first()"
        type: decimal
