resourceType: ViewDefinition
id: obs-heart-rate-rhythm
url: ViewDefinition/obs-heart-rate-rhythm
name: obs_heart_rate_rhythm
title: "Heart rate rhythm"
status: active
resource: Observation
description: "One row per 'Heart rate rhythm' Observation for ViewChart dashboards. Codes: SNOMED 364074009 (Regularity of heart rhythm); LOINC 8884-9 (Heart rate rhythm)."
where:
  - path: "code.coding.where((system = 'http://snomed.info/sct' and code = '364074009') or (system = 'http://loinc.org' and code = '8884-9')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Heart rate rhythm'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
