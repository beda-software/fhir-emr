description: "One row per 'NT-proBNP' Observation for ViewChart dashboards. Codes: LOINC 33762-6 (NT-proBNP); LOINC 71425-3 (Natriuretic peptide.B prohormone N-Terminal [Mass/volume] in Blood by Immunoassay)."
