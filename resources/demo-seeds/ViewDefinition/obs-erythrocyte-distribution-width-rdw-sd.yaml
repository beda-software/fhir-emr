resourceType: ViewDefinition
id: obs-erythrocyte-distribution-width-rdw-sd
url: ViewDefinition/obs-erythrocyte-distribution-width-rdw-sd
name: obs_erythrocyte_distribution_width_rdw_sd
title: "Erythrocyte distribution width (RDW-SD)"
status: active
resource: Observation
meta:
  tag:
    - system: https://emr.beda.software/CodeSystem/view-chart
      code: numeric
description: "One row per 'Erythrocyte distribution width (RDW-SD)' Observation for ViewChart dashboards. Codes: LOINC 788-0 (Erythrocyte [DistWidth] in Blood by Automated count); LOINC 21000-5 (Erythrocyte distribution width [Entitic volume] by Automated count)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '788-0') or (system = 'http://loinc.org' and code = '21000-5')).exists()"
  - path: "value.ofType(Quantity).where(code = '%' or unit = '%').empty()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Erythrocyte distribution width (RDW-SD)'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
