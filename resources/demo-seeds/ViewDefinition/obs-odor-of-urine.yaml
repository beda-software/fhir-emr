resourceType: ViewDefinition
id: obs-odor-of-urine
url: ViewDefinition/obs-odor-of-urine
name: obs_odor_of_urine
title: "Odor of Urine"
status: active
resource: Observation
description: "One row per 'Odor of Urine' Observation for ViewChart dashboards. Codes: LOINC 5767-9 (Odor of Urine); LOINC 34533-0 (Odor of Urine)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '5767-9' and display = 'Odor of Urine') or (system = 'http://loinc.org' and code = '34533-0')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Odor of Urine'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
