resourceType: ViewDefinition
id: obs-protocol-for-responding-to-and-assessing-patients-as
url: ViewDefinition/obs-protocol-for-responding-to-and-assessing-patients-as
name: obs_protocol_for_responding_to_and_assessing_patients_as
title: "Protocol for Responding to and Assessing Patients' Assets, Risks, and Experiences [PRAPARE]"
status: active
resource: Observation
description: "One row per 'Protocol for Responding to and Assessing Patients' Assets, Risks, and Experiences [PRAPARE]' Observation for ViewChart dashboards. Codes: LOINC 93025-5 (Protocol for Responding to and Assessing Patients' Assets, Risks, and Experiences [PRAPARE])."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '93025-5')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Protocol for Responding to and Assessing Patients\\' Assets, Risks, and Experiences [PRAPARE]'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
