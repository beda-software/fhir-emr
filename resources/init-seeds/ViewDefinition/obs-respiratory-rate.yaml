resourceType: ViewDefinition
id: obs-respiratory-rate
url: ViewDefinition/obs-respiratory-rate
name: obs_respiratory_rate
title: "Respiratory rate"
status: active
resource: Observation
meta:
  tag:
    - system: https://emr.beda.software/CodeSystem/view-chart
      code: numeric
description: "One row per 'Respiratory rate' Observation for ViewChart dashboards. Codes: LOINC 9279-1 (Respiratory rate); SNOMED 86290005 (Respiratory rate)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '9279-1') or (system = 'http://snomed.info/sct' and code = '86290005')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Respiratory rate'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
