resourceType: ViewDefinition
id: obs-body-temperature
url: ViewDefinition/obs-body-temperature
name: obs_body_temperature
title: "Body temperature"
status: active
resource: Observation
meta:
  tag:
    - system: https://emr.beda.software/CodeSystem/view-chart
      code: numeric
description: "One row per 'Body temperature' Observation for ViewChart dashboards. Codes: LOINC 8310-5 (Body temperature); LOINC 8331-1 (Oral temperature); SNOMED 386725007 (Body temperature); SNOMED 415945006 (Oral temperature); SNOMED 415882003 (Axillary temperature); SNOMED 415974002 (Tympanic temperature)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '8310-5') or (system = 'http://loinc.org' and code = '8331-1') or (system = 'http://snomed.info/sct' and code = '386725007') or (system = 'http://snomed.info/sct' and code = '415945006') or (system = 'http://snomed.info/sct' and code = '415882003') or (system = 'http://snomed.info/sct' and code = '415974002')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Body temperature'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
