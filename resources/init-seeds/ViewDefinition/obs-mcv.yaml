resourceType: ViewDefinition
id: obs-mcv
url: ViewDefinition/obs-mcv
name: obs_mcv
title: "MCV"
status: active
resource: Observation
meta:
  tag:
    - system: https://emr.beda.software/CodeSystem/view-chart
      code: numeric
description: "One row per 'MCV' Observation for ViewChart dashboards. Codes: LOINC 787-2 (MCV [Entitic mean volume] in Red Blood Cells by Automated count); LOINC 30428-7 (MCV)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '787-2') or (system = 'http://loinc.org' and code = '30428-7')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'MCV'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
