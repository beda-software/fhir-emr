resourceType: ViewDefinition
id: obs-treatment-status-cancer
url: ViewDefinition/obs-treatment-status-cancer
name: obs_treatment_status_cancer
title: "Treatment status Cancer"
status: active
resource: Observation
description: "One row per 'Treatment status Cancer' Observation for ViewChart dashboards. Codes: LOINC 59557-9 (Treatment status Cancer)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '59557-9')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Treatment status Cancer'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
