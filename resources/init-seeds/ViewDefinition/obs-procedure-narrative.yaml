resourceType: ViewDefinition
id: obs-procedure-narrative
url: ViewDefinition/obs-procedure-narrative
name: obs_procedure_narrative
title: "Procedure Narrative"
status: active
resource: Observation
description: "One row per 'Procedure Narrative' Observation for ViewChart dashboards. Codes: LOINC 29554-3 (Procedure Narrative)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '29554-3')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Procedure Narrative'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
