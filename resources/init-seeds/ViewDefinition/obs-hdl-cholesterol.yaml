resourceType: ViewDefinition
id: obs-hdl-cholesterol
url: ViewDefinition/obs-hdl-cholesterol
name: obs_hdl_cholesterol
title: "HDL Cholesterol"
status: active
resource: Observation
meta:
  tag:
    - system: https://emr.beda.software/CodeSystem/view-chart
      code: numeric
description: "One row per 'HDL Cholesterol' Observation for ViewChart dashboards. Codes: LOINC 2085-9 (Cholesterol in HDL [Mass/volume] in Serum or Plasma); LOINC 14646-4 (Cholesterol in HDL [Moles/volume] in Serum or Plasma). value_quantity is converted to mg/dL from mmol/L (x38.67)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '2085-9') or (system = 'http://loinc.org' and code = '14646-4')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'HDL Cholesterol'"
        type: string
      - name: unit
        path: "'mg/dL'"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: reference_range
        path: "referenceRange"
        collection: true
  - unionAll:
      - forEach: "value.ofType(Quantity).where(code = 'mmol/L' or unit = 'mmol/L')"
        column:
          - name: value_quantity
            path: "value * 38.67"
            type: decimal
      - forEach: "value.ofType(Quantity).where(code != 'mmol/L' and unit != 'mmol/L')"
        column:
          - name: value_quantity
            path: value
            type: decimal
