resourceType: ViewDefinition
id: obs-cause-of-death-us-standard-certificate-of-death
url: ViewDefinition/obs-cause-of-death-us-standard-certificate-of-death
name: obs_cause_of_death_us_standard_certificate_of_death
title: "Cause of Death [US Standard Certificate of Death]"
status: active
resource: Observation
description: "One row per 'Cause of Death [US Standard Certificate of Death]' Observation for ViewChart dashboards. Codes: LOINC 69453-9 (Cause of Death [US Standard Certificate of Death])."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '69453-9')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Cause of Death [US Standard Certificate of Death]'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
