resourceType: ViewDefinition
id: obs-oxygen-saturation
url: ViewDefinition/obs-oxygen-saturation
name: obs_oxygen_saturation
title: "Oxygen saturation"
status: active
resource: Observation
meta:
  tag:
    - system: https://emr.beda.software/CodeSystem/view-chart
      code: numeric
description: "One row per 'Oxygen saturation' Observation for ViewChart dashboards. Codes: LOINC 2708-6 (Oxygen saturation in Arterial blood); LOINC 59408-5 (Oxygen saturation in Arterial blood by Pulse oximetry); SNOMED 104847001 (Oxygen saturation measurement)."
where:
  - path: "code.coding.where((system = 'http://loinc.org' and code = '2708-6') or (system = 'http://loinc.org' and code = '59408-5') or (system = 'http://snomed.info/sct' and code = '104847001')).exists()"
select:
  - column:
      - name: id
        path: "getResourceKey()"
        type: string
      - name: patient_id
        path: "subject.getReferenceKey(Patient)"
        type: string
      - name: axis_label
        path: "effective.ofType(dateTime)"
        type: dateTime
      - name: title
        path: "'Oxygen saturation'"
        type: string
      - name: unit
        path: "value.ofType(Quantity).unit"
        type: string
      - name: value_integer
        path: "value.ofType(integer)"
        type: integer
      - name: value_code
        path: "{}"
        type: code
      - name: value_concept_code
        path: "value.ofType(CodeableConcept).coding.code.first()"
        type: code
      - name: value_display
        path: "value.ofType(CodeableConcept).coding.display.first()"
        type: string
      - name: value_string
        path: "value.ofType(string)"
        type: string
      - name: value_quantity
        path: "value.ofType(Quantity).value"
        type: decimal
      - name: reference_range
        path: "referenceRange"
        collection: true
