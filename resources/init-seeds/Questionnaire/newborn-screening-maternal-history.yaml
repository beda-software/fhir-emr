resourceType: Questionnaire
id: newborn-screening-maternal-history
name: newborn-screening-maternal-history
title: Maternal medical and family history (newborn screening)
status: active
description: >-
  The mother's medical and family history that determines which newborn screening pathway her infants follow.
  Extracted as the mother's Observations (computed risk flags and SNOMED CT coded findings) that the Newborn
  Screening SMART app synchronises on launch, where they show as the newborns' maternal risk factors.
subjectType:
  - Patient
url: https://emr.beda.software/Questionnaire/newborn-screening-maternal-history
mapping:
  - reference: urn:uuid:Mapping:newborn-screening-maternal-history-extract
meta:
  profile:
    - https://emr-core.beda.software/StructureDefinition/fhir-emr-questionnaire
useContext:
  - code:
      code: questionnaire-type
      system: https://beda.software/FHIR/CodeSystem/questionnaire-type
    value:
      CodeableConcept:
        coding:
          - code: form-library
  - code:
      code: category
      system: https://beda.software/FHIR/CodeSystem/questionnaire-category
    value:
      CodeableConcept:
        coding:
          - code: paediatrics
            system: https://beda.software/FHIR/CodeSystem/questionnaire-category
launchContext:
