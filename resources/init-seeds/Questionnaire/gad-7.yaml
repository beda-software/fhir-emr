id: gad-7
resourceType: Questionnaire
name: gad-7
title: GAD-7
_title:
  translation:
    - lang: es
      content: GAD-7
status: active
description: Generalised Anxiety Disorder 7-item scale; screens severity of anxiety symptoms over the past two weeks.
_description:
  translation:
    - lang: es
      content: Escala de 7 ítems del Trastorno de Ansiedad Generalizada; evalúa la gravedad de los síntomas de ansiedad durante las últimas dos semanas.
subjectType:
  - Encounter
  - Patient
useContext:
  - code:
      code: questionnaire-type
      system: https://beda.software/FHIR/CodeSystem/questionnaire-type
    value:
      CodeableConcept:
        coding:
          - code: form-library
  - code:
      code: category
      system: https://beda.software/FHIR/CodeSystem/questionnaire-category
    value:
      CodeableConcept:
        coding:
          - code: mental-health
            system: https://beda.software/FHIR/CodeSystem/questionnaire-category
mapping:
