    type: dateTime
    linkId: dateTime
    hidden: true
    initialExpression:
      language: text/fhirpath
      expression: "now()"

  - text: PatientId
    type: string
    linkId: patientId
    hidden: true
    initialExpression:
      language: text/fhirpath
      expression: "%Patient.id"

  - text: PatientName
    type: string
    linkId: patientName
    hidden: true
    initialExpression:
      language: text/fhirpath
      expression: "%Patient.name.first().given.first() + ' ' + %Patient.name.first().family"

  - text: Over the last two weeks, how often have you been bothered by the following problems?
    _text:
      translation:
        - lang: es
          content: Durante las últimas 2 semanas, ¿qué tan seguido ha tenido molestias debido a los siguientes problemas?
    type: group
    itemControl:
      coding:
      - code: group-voice
    linkId: gad-7
    item:
      - linkId: 69725-0
        text: Feeling nervous, anxious, or on edge
        _text:
          translation:
            - lang: es
              content: Se ha sentido nervioso(a), ansioso(a) o con los nervios de punta
        required: true
        type: choice
        itemControl:
          coding:
            - code: inline-choice
        answerOption:
          - valueCoding:
              system: "http://loinc.org"
              code: "LA6568-5"
              display: "Not at all"
              _display:
                translation:
                  - lang: es
                    content: Ningún día
              extension:
                - url: "http://hl7.org/fhir/StructureDefinition/itemWeight"
                  valueDecimal: 0
          - valueCoding:
              system: "http://loinc.org"
              code: "LA6569-3"
              display: "Several days"
              _display:
                translation:
                  - lang: es
                    content: Varios días
              extension:
                - url: "http://hl7.org/fhir/StructureDefinition/itemWeight"
                  valueDecimal: 1
          - valueCoding:
              system: "http://loinc.org"
              code: "LA6570-1"
              display: "More than half the days"
              _display:
                translation:
                  - lang: es
                    content: Más de la mitad de los días
              extension:
                - url: "http://hl7.org/fhir/StructureDefinition/itemWeight"
                  valueDecimal: 2
          - valueCoding:
              system: "http://loinc.org"
              code: "LA6571-9"
              display: "Nearly every day"
              _display:
                translation:
                  - lang: es
                    content: Casi todos los días
              extension:
